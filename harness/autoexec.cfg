# Capture-harness baseline config (copied to run360/var/autoexec.cfg).
# harness/lensrun.sh rewrites the WIDE_VIEW_* lines per lens before each run.

PNG_SCREENSHOT 1
ARMAGETRON_SCREENMODE 0
ARMAGETRON_WINDOWSIZE 8

# 60 instead of the software renderer's ~200: fewer frames to step through,
# and replay-driven comparisons between builds stay affordable.
MAX_FPS 60

WIDE_VIEW_LENS 0
WIDE_VIEW_FOV 360
WIDE_VIEW_GLOBE 0
WIDE_VIEW_PLATE_RES 0.5
WIDE_VIEW_LENS_RES 0.5

# F10 takes screenshots; the other function keys default to the mess-up menu
# and would fire during a drive sequence.
KEYBOARD 291 PLAYER_BIND SCREENSHOT 0
KEYBOARD 290 PLAYER_BIND MESS_UP 0
KEYBOARD 292 PLAYER_BIND MESS_DOWN 0
KEYBOARD 293 PLAYER_BIND MESS_END 0
