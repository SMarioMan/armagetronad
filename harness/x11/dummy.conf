# Headless Xorg with the dummy driver and AIGLX, 1280x800.
# Run as: unshare -rm ... Xorg :94 -config /home/agent/agtk/etx11/dummy.conf
Section "Module"
  Load "glx"
  Load "dri2"
EndSection

Section "ServerFlags"
  Option "DontVTSwitch" "true"
  Option "AutoAddDevices" "false"
  Option "AllowEmptyInitialConfiguration" "true"
  Option "BlankTime" "0"
  Option "StandbyTime" "0"
  Option "SuspendTime" "0"
  Option "OffTime" "0"
EndSection

Section "Device"
  Identifier "dummy0"
  Driver "dummy"
  Option "DummyCrtc" "0"
EndSection

Section "Monitor"
  Identifier "mon0"
  HorizSync 28.0-80.0
  VertRefresh 48.0-75.0
  Modeline "1280x800" 68.0 1280 1328 1360 1440 800 803 809 823 +hsync +vsync
EndSection

Section "Screen"
  Identifier "scr0"
  Device "dummy0"
  Monitor "mon0"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x800"
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier "lay0"
  Screen 0 "scr0" 0 0
  Option "AIGLX" "true"
EndSection

Section "Extensions"
  Option "Composite" "Disable"
EndSection
