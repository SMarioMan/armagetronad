<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Armagetron Advanced (WebAssembly)</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #101018;
      height: 100%;
      overflow: hidden;
      font-family: "DejaVu Sans Mono", monospace;
    }
    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    canvas.emscripten {
      border: 1px solid #334;
      background: #000;
      image-rendering: pixelated;
      /* keyboard goes here; click it first */
      outline: none;
      /* letterboxed fit: the canvas' own pixel aspect ratio is preserved
         (it follows the in-game Screen Mode resolution), and the fit
         re-evaluates live on window resize */
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: calc(100vh - 56px);
    }
    #fsBtn {
      position: fixed;
      top: 8px;
      right: 10px;
      z-index: 10;
      background: #1a2030;
      color: #9ab;
      border: 1px solid #334;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1;
      padding: 6px 9px;
      cursor: pointer;
    }
    #fsBtn:hover {
      background: #243050;
      color: #cde;
    }
    #status {
      color: #9ab;
      font-size: 14px;
      margin: 8px 0 2px 0;
      min-height: 18px;
    }
    #hint {
      color: #667;
      font-size: 12px;
      margin-top: 4px;
    }
    .progress {
      height: 6px;
      width: 480px;
      max-width: 80vw;
      background: #223;
      margin-top: 6px;
      display: none;
    }
    .progress .bar {
      height: 100%;
      width: 0%;
      background: #48f;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="emscripten" id="status">Loading Armagetron Advanced…</div>
    <div class="progress" id="progress"><div class="bar" id="progressbar"></div></div>
    <canvas class="emscripten" id="canvas" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>
    <div id="hint">click the canvas to give it keyboard focus &nbsp;·&nbsp; arrows/enter navigate, ESC backs out</div>
    <button id="fsBtn" title="Toggle fullscreen (double-click the canvas)">⛶</button>
  </div>
  <script>
    // ---- persistent user data (IndexedDB / IDBFS) ----
    // tPath::GetWritePath() writes to the LAST entry of tPathVar::Paths(),
    // i.e. st_UserDataDir + "/var" == ~/.armagetronad/var (the data-dir
    // var/ is read-only).  Emscripten's browser env sets HOME to
    // /home/web_user deterministically, so we mount IDBFS on the whole
    // user home: user.cfg, scorelog, recordings all persist across reloads.
    var ARMA_HOME_DIR = '/home/web_user';
    // The game calls __persistConfig() after every config save; a burst of
    // saves (boot, menu navigation, setting changes) would fire many
    // overlapping FS.syncfs() calls on the one IDBFS mount.  IDBFS warns
    // about that ("N FS.syncfs operations in flight at once") and repeats the
    // whole directory walk for each of them.  Serialize and coalesce: one
    // sync at a time, one follow-up if a save arrived while busy, and a short
    // debounce so a burst costs a single write.
    var __syncInFlight = false;
    var __syncAgain = false;
    var __syncTimer = 0;
    function __flushUserData() {
      if (__syncInFlight) {
        __syncAgain = true;
        return;
      }
      __syncInFlight = true;
      try {
        FS.syncfs(false, function (err) {
          __syncInFlight = false;
          if (err) console.error('IDBFS save failed:', err);
          if (__syncAgain) {
            __syncAgain = false;
            __flushUserData();
          }
        });
      } catch (e) {
        __syncInFlight = false;
        console.error(e);
      }
    }
    function __persistConfig() {
      if (__syncInFlight) {
        __syncAgain = true;
        return;
      }
      if (__syncTimer) return;
      __syncTimer = setTimeout(function () {
        __syncTimer = 0;
        __flushUserData();
      }, 400);
    }
    window.__persistConfig = __persistConfig;
    window.addEventListener('beforeunload', function () {
      // No room for a debounce while unloading: drop the pending timer and
      // push the newest state out on a best effort basis.
      if (__syncTimer) {
        clearTimeout(__syncTimer);
        __syncTimer = 0;
      }
      __flushUserData();
    });
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var progressElementBar = document.getElementById('progressbar');
    var canvas = document.getElementById('canvas');

    // ---- command line via URL: ?args=--playback,/rec1.adr ----
    // File options (--playback/--record/--playback-bench) are fetched from
    // the web root and written into the Emscripten FS before main() runs.
    var ARMA_ARGS = (function () {
      var m = /args=([^&]*)/.exec(location.search);
      return m ? decodeURIComponent(m[1]).split(',').filter(Boolean) : [];
    })();
    var ARMA_FILES = ARMA_ARGS.filter(function (a, i) {
      return i > 0 &&
        ['--playback', '--record', '--playback-bench'].indexOf(ARMA_ARGS[i - 1]) >= 0;
    });

    // keep the canvas focused for SDL keyboard events
    canvas.addEventListener('mousedown', function () { canvas.focus(); });
    // real fullscreen toggle: button or double-click the canvas.
    // CSS re-fits the letterboxed canvas automatically.
    var fsBtn = document.getElementById('fsBtn');
    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen().catch(function (e) {
          console.warn('fullscreen request failed:', e);
        });
      }
    }
    fsBtn.addEventListener('click', toggleFullscreen);
    canvas.addEventListener('dblclick', toggleFullscreen);

    var Module = {
      arguments: ARMA_ARGS,
      preRun: [function () {
        // Gate main() until the persisted config is loaded from IDBFS.
        Module.addRunDependency('idbfs_config');
        try {
          FS.mkdirTree(ARMA_HOME_DIR);
          FS.mount(IDBFS, {}, ARMA_HOME_DIR);
          FS.syncfs(true, function (err) {
            if (err) console.error('IDBFS load failed:', err);
            Module.removeRunDependency('idbfs_config');
          });
        } catch (e) {
          console.error('IDBFS setup failed:', e);
          Module.removeRunDependency('idbfs_config');
        }
      },
      function () {
        // Fetch the files named by the command line into the FS.
        if (!ARMA_FILES.length) return;
        Module.addRunDependency('cli_files');
        var finish = function (err) {
          if (err) console.error('file load failed:', err);
          Module.removeRunDependency('cli_files');
        };
        (async function () {
          try {
            for (var f of ARMA_FILES) {
              var r = await fetch(f.replace(/^\//, ''));
              if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + f);
              var buf = new Uint8Array(await r.arrayBuffer());
              var dir = f.slice(0, f.lastIndexOf('/'));
              if (dir) FS.mkdirTree(dir);
              FS.writeFile(f, buf);
            }
          } catch (e) { finish(e); return; }
          finish();
        })();
      }],
      // main() returns once the menu loop is handed to the JS event loop;
      // without this the runtime would abort (ABORT=true) on main's return
      noExitRuntime: true,
      canvas: canvas,
      print: function (t) { console.warn(t); },
      printErr: function (t) { console.warn(t); },
      setStatus: function (text) {
        if (text === undefined || text === '') {
          statusElement.textContent = 'Running. Click the canvas to play.';
          progressElement.style.display = 'none';
          if (document.activeElement !== canvas) canvas.focus();
          return;
        }
        if (text === 'Preparing...' || text === 'Running...') {
          statusElement.textContent = text;
          return;
        }
        statusElement.textContent = text;
        var m = /([0-9]+)\/([0-9]+)/.exec(text);
        if (m) {
          progressElement.style.display = 'block';
          progressElementBar.style.width = (m[1] / m[2] * 100) + '%';
          return;
        }
        var m2 = /([0-9.]+)%/.exec(text);
        if (m2) {
          progressElement.style.display = 'block';
          progressElementBar.style.width = m2[1] + '%';
        }
      },
      onRuntimeInitialized: function () {
        statusElement.textContent = 'Running. Click the canvas to play.';
        progressElement.style.display = 'none';
        canvas.focus();
        reportWindowSize();
      },
      onAbort: function (reason) {
        statusElement.textContent = 'Aborted: ' + reason;
      }
    };

    // ---- "desktop" screen mode: track the live window size ----
    // The game's "desktop" mode renders at the window resolution.  We report
    // the available area (window minus the status/hint chrome, matching the
    // CSS max-height: calc(100vh - 56px)) to the wasm on load and on every
    // resize; the wasm re-inits the display so canvas and GL viewport follow
    // the window.  Fixed resolutions are untouched (they keep their internal
    // size and are letterboxed by the CSS).
    var ARMA_CHROME_H = 56;
    var wasmResizeTimer = 0;
    function reportWindowSize() {
      if (typeof Module === 'undefined' || typeof Module._sr_WasmWindowResized !== 'function') return;
      var w = window.innerWidth;
      var h = Math.max(240, window.innerHeight - ARMA_CHROME_H);
      Module._sr_WasmWindowResized(w, h);
    }
    // Debounce: the resize event fires continuously while the user drags the
    // window edge, and the wasm re-init re-creates the GL context (heavy).
    // Wait for the resize to settle before re-initializing the display.
    window.addEventListener('resize', function () {
      clearTimeout(wasmResizeTimer);
      wasmResizeTimer = setTimeout(reportWindowSize, 200);
    });

    window.onerror = function (msg, url, line) {
      statusElement.textContent = 'Error: ' + msg + ' (line ' + line + ')';
      return false;
    };
  </script>
  <script>
  // Network transport (src/network/nSocket.cpp reads Module.ARM_PROXY_BASE):
  //   proxy mode  : <ARM_PROXY_BASE>?target=<ip>:<port>  -- run webgl/proxy/proxy.js
  //   direct mode : ws(s)://<ip>:<port>                  -- default, needs a
  //                 server that speaks WebSockets; the stock Armagetron
  //                 server does not, so multiplayer needs the proxy.
  // On an https page (GitHub Pages) the proxy must be wss://, or the browser
  // blocks it as mixed content.  Override per session with ?proxy=wss://host/,
  // or permanently in localStorage (key arma_proxy_base).
  var Module = window.Module || {};
  (function () {
    var m = /[?&]proxy=([^&]*)/.exec(location.search);
    var base = m ? decodeURIComponent(m[1])
                  : (window.ARM_PROXY_BASE !== undefined
                      ? window.ARM_PROXY_BASE
                      : (localStorage.getItem('arma_proxy_base') || ''));
    Module.ARM_PROXY_BASE = base;
    if (base) { try { localStorage.setItem('arma_proxy_base', base); } catch (e) {} }
    console.log('network: ' + (base ? 'proxy ' + base : 'direct (no WebSocket server support => singleplayer only)'));
  })();
  </script>
  <script src="armagetronad_main.js"></script>
</body>
</html>
