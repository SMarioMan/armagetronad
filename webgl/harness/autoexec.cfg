FIRST_USE 0
# ArmageTron_1280_800 (rScreen.h enum index 8): the native build clamps to it
# and the browser canvas is pinned to the same box by the harness css, so both
# sides render at exactly 1280x800.
ARMAGETRON_WINDOWSIZE 8
ARMAGETRON_SCREENMODE 0
FULLSCREEN 0
FLOOR_DETAIL 3
SP_WALLS_STAY_UP_DELAY 600
SP_NUM_AIS 10
TEXTURES_HI 1
ALPHA_BLEND 1
TEXT_OUT 0
SP_AI_IQ 30
AUTO_AIS 0
SP_WALLS_LENGTH 1000
MAX_FPS 60
# Arena half-size multiplier, as an exponent: 2 quadruples the default.  More
# room means the computer players survive longer and leave far more walls in
# view, which is what the wall-line measurements need.
SP_SIZE_FACTOR 2
COLOR_R_1 0
COLOR_G_1 15
COLOR_B_1 0
COLOR_R_2 15
COLOR_G_2 15
COLOR_B_2 3
COLOR_R_3 15
COLOR_G_3 3
COLOR_B_3 3
COLOR_R_4 3
COLOR_G_4 15
COLOR_B_4 3
# SOFTWARE_RENDERER only takes effect when GL_VENDOR/GL_RENDERER match one of the
# software-GL tests in rScreen.cpp:869-894 (Microsoft/SGI Generic, Mesa "Software
# Rasterizer", indirect GLX).  llvmpipe's strings match none of them, so this
# reference build already runs the hardware path -- sr_alphaBlend on (which keeps
# FLOOR_DETAIL 3 from being clamped to a single texture at eDisplay.cpp:377),
# high rim and dithering on -- like a desktop player does.  Measured: setting
# this to 0 or 1 produces byte-identical frames here, so it stays explicit.
SOFTWARE_RENDERER 0

# Camera.  The player's initial camera is CAMERA_CUSTOM (ePlayer.cpp:1193) and the
# custom camera parks 30 units behind and 20 units above the cycle with a -0.7 pitch
# (eCamera.cpp:238), which is why every harness frame so far has the cycle roughly ten
# pixels tall and the floor grid compressed into the far band: the model shape, the
# wall band and the grid line width are all only measurable once the camera is low and
# close.  These three are plain globals, so both builds read the same numbers and a
# pair stays a like-for-like comparison, and the replay drives the world, so the camera
# changes only what is rendered.  The stamp's h field is the camera height, so a drop
# from the observed 16.7-20.7 to about 2.5 is the check that these took effect.
CAMERA_CUSTOM_BACK 7
CAMERA_CUSTOM_RISE 2.5
CAMERA_CUSTOM_PITCH -0.25
