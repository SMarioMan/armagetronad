FIRST_USE 0
# Deterministic profile for the parity pair.  Recorded on the desktop and
# replayed unchanged by both builds, so a frame gated on game time is the same
# world state on both sides.  Both builds read it as the var-directory
# autoexec.cfg (the browser harness serves it to a page hook that installs it
# before the first frame).
#
# No computer opponents: their decisions are recomputed per rendered frame and
# compared with the recorded ones, so the two builds part into different worlds
# within seconds of play.  No HUD: its help text is content, not pixels.  No
# dither: WebGL has no GL_DITHER, so the port never dithers and a desktop
# driver's ordered-dither lattice would dominate any diff.
ARMAGETRON_WINDOWSIZE 8
ARMAGETRON_SCREENMODE 0
FULLSCREEN 0
FLOOR_DETAIL 3
SP_WALLS_STAY_UP_DELAY 600
SP_NUM_AIS 0
TEXTURES_HI 1
ALPHA_BLEND 1
TEXT_OUT 0
SP_AI_IQ 30
AUTO_AIS 0
SP_WALLS_LENGTH 1000
MAX_FPS 60
DITHER 0
SHOW_HUD 0
# Wide arena: the lone cycle survives tens of seconds instead of dying on the
# default ring, and the floor gets a long run to the horizon - the region the
# grid-line complaint is about.
SP_SIZE_FACTOR 2
# Texture filters per group (0 floor, 1 wall, 2 object, 3 font): 9987 =
# GL_LINEAR_MIPMAP_LINEAR, 9729 = GL_LINEAR.  Pinned so a stale IDBFS user.cfg
# on the port and a stale user.cfg on the desktop cannot silently differ.
TEXTURE_MODE_0 9987
TEXTURE_MODE_1 9987
TEXTURE_MODE_2 9987
TEXTURE_MODE_3 9729
COLOR_R_1 0
COLOR_G_1 15
COLOR_B_1 0
COLOR_R_2 15
COLOR_G_2 15
COLOR_B_2 3
COLOR_R_3 15
COLOR_G_3 3
COLOR_B_3 3
COLOR_R_4 3
COLOR_G_4 15
COLOR_B_4 3
SOFTWARE_RENDERER 0
